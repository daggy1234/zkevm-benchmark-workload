[package]
name = "fixture-patcher"
version = "0.1.0"
edition = "2024"

[dependencies]
witness-generator = { path = "../witness-generator" }
alloy-consensus = "1.8"
alloy-primitives = "1.5"
alloy-rlp = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
